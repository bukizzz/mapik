version: "3.8"

# Servisi za aplikaciju MAPIK
services:
  MAPIK:
    image: ghcr.io/bukizzz/mapik:latest
    container_name: MAPIK
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    restart: always
    volumes:
      - ./data:/app/data # Mapiranje volumena za trajno skladištenje podataka
    stop_grace_period: ${SERVER_GRACEFUL_SHUTDOWN_TIMEOUT:-10}s # Vremenski period za graciozno gašenje
    healthcheck:
      test: wget -q --spider -T 10 -O /dev/null http://localhost:${PORT:-3001}/health # Provera zdravlja servisa
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy # Zavisnost od PostgreSQL servisa

  postgres:
    image: "postgres:16"
    container_name: MAPIK-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: MAPIK
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data # Mapiranje volumena za PostgreSQL podatke
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MAPIK"] # Provera zdravlja PostgreSQL baze
      interval: 5s
      timeout: 5s
      retries: 10
